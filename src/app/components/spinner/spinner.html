<div class="spinner-container">
  <div class="workouts-roulette">
    @for (workout of workouts(); track workout.id; let i = $index) {
      <div
        class="roulette-item"
        [class.highlighted]="isWorkoutHighlighted(i)"
        [class.selected]="selectedWorkout() === workout">
        {{ workout.name }}
      </div>
    }
  </div>

  <button class="spin-button" (click)="spin()" [disabled]="isSpinning()">
    {{ isSpinning() ? 'Selecting...' : 'Start!' }}
  </button>
</div>
